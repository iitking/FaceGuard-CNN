version: '3.8'

services:
  faceguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faceguard-cnn-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - CONFIDENCE_THRESHOLD=0.50
    volumes:
      - ./FaceGuard-CNN_model.keras:/workspace/FaceGuard-CNN_model.keras:ro
